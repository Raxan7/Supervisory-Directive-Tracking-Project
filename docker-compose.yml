services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./uploads:/app/uploads"]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supervisory
      POSTGRES_USER: supervisory
      POSTGRES_PASSWORD: supervisory
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supervisory -d supervisory"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:

