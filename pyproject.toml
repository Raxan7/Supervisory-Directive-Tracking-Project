[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supervisory-tracking-api"
version = "0.1.0"
description = "FastAPI backend for the Supervisory Findings and Directives Tracking & Analytics System"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.16,<2.0",
  "pydantic-settings>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "email-validator>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "python-docx>=1.2,<2.0",
  "pypdf>=6.0,<7.0",
  "pdfplumber>=0.11,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9.0", "httpx>=0.28,<1.0", "ruff>=0.12,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
